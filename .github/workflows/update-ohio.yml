name: Update Ohio data

on:
  schedule:
    # Saturday and Sunday mornings (Eastern), August through December,
    # after the Friday and Saturday night games are posted.
    - cron: '0 14 * 8-12 6,0'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/fetch-ohio.mjs
      - name: Commit new data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add ohio/data
          git diff --cached --quiet || (git commit -m "Update Ohio scores" && git push)
