<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Road to the Playoff</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="topbar-inner">
        <a class="brand" href="#top">Road to the Playoff</a>
        <nav class="favs" id="favs" aria-label="Favorite teams"></nav>
        <button class="btn" id="add-team" type="button">+ Add team</button>
      </div>
    </header>

    <main id="top">
      <div id="status" class="status" role="status">Loading the season…</div>
      <div id="app" hidden>
        <section id="hero"></section>
        <nav class="subnav" aria-label="Sections">
          <a href="#schedule">Schedule</a>
          <a href="#watch">Games to watch</a>
          <a href="#bracket">Bracket</a>
          <a href="#players">Players</a>
          <a href="#rankings">Top 25</a>
        </nav>
        <div class="layout">
          <div class="col-main">
            <section id="schedule" class="card"></section>
            <section id="watch" class="card"></section>
            <section id="bracket" class="card"></section>
            <section id="players" class="card"></section>
          </div>
          <aside class="col-side">
            <section id="rankings" class="card"></section>
            <section id="odds" class="card"></section>
          </aside>
        </div>
        <footer class="foot" id="foot"></footer>
      </div>
    </main>

    <dialog id="picker" class="picker">
      <form method="dialog" class="picker-head">
        <input id="picker-search" type="search" placeholder="Search teams or conferences" autocomplete="off" aria-label="Search teams" />
        <button class="btn" value="close">Done</button>
      </form>
      <div id="picker-list" class="picker-list"></div>
    </dialog>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
